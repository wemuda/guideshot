name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-one:
    name: Phase 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @guideshot/playwright exec playwright install --with-deps chromium

      - name: Prepare workspace package artifacts
        run: pnpm --filter './packages/**' -r build

      - name: Check package tarballs
        run: pnpm pack:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate pilot recipes
        run: pnpm --filter @guideshot/site run shots:validate

      - name: Generate portable schemas
        run: pnpm --filter @guideshot/site run shots:schema

      - name: Plan pilot captures
        run: pnpm --filter @guideshot/site run shots:plan

      - name: Capture pilot screenshots
        run: pnpm --filter @guideshot/site run shots:capture

      - name: Recompose pilot screenshots
        run: pnpm --filter @guideshot/site run shots:compose

      - name: Verify pilot outputs
        run: pnpm --filter @guideshot/site run shots:verify
